# Линт проекта (сессия 34, E2). Запускается в CI: `ruff check backend`.
# Без установки локально: CI ставит ruff отдельным шагом. Цель — поймать реальные баги
# (неопределённые имена, битый синтаксис, неиспользуемые импорты), а не вкусовщину стиля.
line-length = 140
target-version = "py312"

[lint]
# E: pycodestyle-ошибки, F: pyflakes (неопределённые/неиспользуемые имена) — критичное.
# Выборочно: E4/E7/E9 (импорты/синтаксис/логика), F (имена/импорты). Стилевые E1/E3
# оставляем вне авторитарного блока — проект пишется с жирными строками промптов.
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E501",   # длинные строки промптов/текстов — сознательно
    "F401",   # импорты-«транзиты» в __init__ и реэкспортах фасада narrator
]
