# Линт проекта (сессия 34, E2). Запускается в CI: `ruff check backend`.
# Без установки локально: CI ставит ruff отдельным шагом. Цель — поймать реальные баги
# (неопределённые имена, битый синтаксис, неиспользуемые импорты), а не вкусовщину стиля.
line-length = 140
target-version = "py312"

[lint]
# E: pycodestyle-ошибки, F: pyflakes (неопределённые/неиспользуемые имена) — критичное.
# Выборочно: E4/E7/E9 (импорты/синтаксис/логика), F (имена/импорты). Стилевые E1/E3
# оставляем вне авторитарного блока — проект пишется с жирными строками промптов.
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E501",   # длинные строки промптов/текстов — сознательно
    # F401 больше НЕ глобальный (аудит 38, D2): раньше он глушил 44 неиспользуемых
    # импорта, среди которых были и настоящие «транзиты» фасада, и мусор. Теперь
    # неиспользуемый импорт — ошибка, а осознанный реэкспорт защищён per-file-ignores
    # ниже (у narrator.py есть явный __all__, у routers/__init__.py — реэкспорт роутеров).
]

# E402 («импорт не в начале файла») — в этом проекте НАМЕРЕННО, а не забывчиво:
#   * narrator.py — фасад: сначала конфиг/логгер и механика, затем plots/narrators_loader
#     (иначе цикл импортов narrator ↔ plots ↔ narrator_data);
#   * routers/worlds.py|lore.py|system.py — роутеры реэкспортируют помощники из
#     routers/core.py, импорт идёт после `router = APIRouter()`/логгера, чтобы
#     избежать цикла core ↔ worlds/lore/system;
#   * embeddings.py — тяжёлые/поздние импорты (asyncio/threading) под секцией fastembed.
# Перенос этих импортов «наверх» ломает загрузку пакета, поэтому глушим точечно,
# а не глобально: E402 остаётся включённым для остального кода (сессия 37).
#
# F401 (сессия 38, D2) — только там, где реэкспорт ЯВНЫЙ и осознанный:
#   * narrator.py — НЕ игнорируется: у фасада есть явный __all__, и ruff сам понимает,
#     что эти имена реэкспортируются, а будущий по-настоящему мёртвый импорт там поймается;
#   * routers/__init__.py — пакет собирает роутеры для app.py.
[lint.per-file-ignores]
"backend/narrator.py" = ["E402"]
"backend/routers/__init__.py" = ["F401"]
"backend/embeddings.py" = ["E402"]
"backend/routers/worlds.py" = ["E402"]
"backend/routers/lore.py" = ["E402"]
"backend/routers/system.py" = ["E402"]
"backend/routers/admin.py" = ["E402"]
"backend/routers/entities.py" = ["E402"]
# длинные строки (в т.ч. тексты промптов и цитаты) — вне авторитарного блока и в тестах
"tests/*" = ["E501"]
