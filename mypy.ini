# Типовая проверка (сессия 34, E2). Запускается в CI как НЕ блокирующий шаг
# (continue-on-error): цель — подсветить проблемные места, а не штрафовать за неполную
# типизацию проекта, который рос без mypy. Код по-прежнему проверяют pytest/ruff.
#
# Сессия 38 (D4): шаг CI был СЛОМАН — `mypy backend` падал на первом же файле
# («No parent module — cannot perform relative import»: в проекте нет backend/__init__.py,
# запуск живёт на implicit namespace packages) и НЕ анализировал остальные файлы.
# Правильный запуск — `-p backend` (пакет целиком, 38 файлов). `__init__.py` не заводим:
# он меняет разрешение `python -m uvicorn backend.app:app`.
#
# ⚠ ВАЖНО ПРО ЭТОТ ФАЙЛ: mypy читает его в кодировке локации. На Windows это cp1251,
# где НЕТ байта 0x98 — а это заглавная кириллическая «У» в UTF-8. Поэтому в комментариях
# этого ini заглавную «У» писать нельзя (проверено: падает UnicodeDecodeError у всех
# прогонов mypy на этой машине). Строчные и прочие заглавные — безопасны.
[mypy]
python_version = 3.12
# ЧЕСТНО О НАСТРОЙКАХ (аудит 38, D4; строгость включена в хвостах сессии 38 — пункт D5):
# раньше check_untyped_defs = false означал, что mypy НЕ проверяет тела функций без
# аннотаций, т.е. покрыто только аннотированное. Оставшиеся ~35 замечаний разобраны по
# месту (Optional-цепочки aiosqlite Row|None в db.py через помощники _one_row/_as_dict/_rowid,
# строгий возврат векторов в embeddings.py, приведение типов в metrics/journal/mechanics),
# массовых `# type: ignore` нет — и check_untyped_defs теперь true.
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = false
namespace_packages = true

# Бэкенд целиком: не строгие проверки типов в тех местах, где типы объявлены.
[mypy-backend.*]
check_untyped_defs = true
