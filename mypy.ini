# Типовая проверка (сессия 34, E2). Запускается в CI как НЕ блокирующий шаг
# (continue-on-error): цель — подсветить проблемные места, а не штрафовать за неполную
# типизацию проекта, который рос без mypy. Код по-прежнему проверяет pytest/ruff.
[mypy]
python_version = 3.12
check_untyped_defs = false
disallow_untyped_defs = false
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = false

# Бэкенд целиком: не строгие проверки типов в тех местах, где типы объявлены.
[mypy-backend.*]
check_untyped_defs = false
